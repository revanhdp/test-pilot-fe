# Single-package repo: this file only holds pnpm settings.
# Dependencies whose install scripts are allowed to run.
allowBuilds:
  browser-tabs-lock: false
  core-js: false
  esbuild: true
minimumReleaseAgeExclude:
  - '@clerk/clerk-js@6.41.0'
  - '@clerk/shared@4.42.0'
  - '@clerk/localizations@4.24.2'
  - '@clerk/ui@1.42.0'
